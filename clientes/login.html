<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo - MYG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link rel="stylesheet" href="admin.css">
    <style>
        .spinner-btn {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-top-color: #050b14;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <ion-icon name="shield-checkmark"></ion-icon>
                </div>
                <h1 class="login-title">Panel Administrativo</h1>
                <p class="login-subtitle">MYG · Suscripciones de entretenimiento</p>
            </div>

            <!-- Contenedor dinámico de alertas -->
            <div id="login-alert" class="alert alert-danger" style="display: none;">
                <ion-icon name="alert-circle-outline"></ion-icon>
                <span id="login-alert-text"></span>
            </div>

            <form id="form-login">
                <div class="form-group">
                    <label for="usuario">Usuario Administrador</label>
                    <input type="text" id="usuario" name="usuario" class="form-control" placeholder="admin" required autofocus autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="password-toggle-wrap">
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" id="toggle-password" class="btn-toggle-eye" aria-label="Mostrar u ocultar contraseña">
                            <ion-icon name="eye-outline" id="eye-icon"></ion-icon>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.9rem;">
                    <span id="btn-icon"><ion-icon name="log-in-outline"></ion-icon></span>
                    <span id="btn-text">Ingresar al Panel</span>
                </button>

                <div style="text-align: center; margin-top: 2rem;">
                    <a href="../index.html" style="color: var(--text-muted); font-size: 0.9rem; display: inline-flex; align-items: center; gap: 0.4rem;">
                        <ion-icon name="arrow-back-outline"></ion-icon>
                        Volver al sitio público
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const formLogin   = document.getElementById('form-login');
        const alertBox    = document.getElementById('login-alert');
        const alertText   = document.getElementById('login-alert-text');
        const toggleBtn   = document.getElementById('toggle-password');
        const passInput   = document.getElementById('password');
        const eyeIcon     = document.getElementById('eye-icon');
        const btnSubmit   = document.getElementById('btn-submit');
        const btnIcon     = document.getElementById('btn-icon');
        const btnText     = document.getElementById('btn-text');

        // Toggle mostrar/ocultar contraseña
        toggleBtn.addEventListener('click', () => {
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.setAttribute('name', 'eye-off-outline');
            } else {
                passInput.type = 'password';
                eyeIcon.setAttribute('name', 'eye-outline');
            }
        });

        // Envío por Fetch/AJAX con Spinner
        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.style.display = 'none';

            const usuario  = document.getElementById('usuario').value.trim();
            const password = passInput.value;

            if (!usuario || !password) {
                mostrarError('Por favor complete todos los campos.');
                return;
            }

            // Estado cargando (spinner)
            btnSubmit.disabled = true;
            btnIcon.innerHTML = '<span class="spinner-btn"></span>';
            btnText.textContent = 'Verificando...';

            try {
                const response = await fetch('api_login.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({ usuario, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    alertBox.className = 'alert alert-success';
                    alertBox.innerHTML = '<ion-icon name="checkmark-circle-outline"></ion-icon> <span>¡Credenciales correctas! Redirigiendo...</span>';
                    alertBox.style.display = 'flex';
                    setTimeout(() => {
                        window.location.href = 'index.php';
                    }, 800);
                } else {
                    mostrarError(data.mensaje || 'Error al iniciar sesión.');
                }
            } catch (err) {
                console.error(err);
                mostrarError('No fue posible conectar con el servidor. Intente nuevamente.');
            } finally {
                btnSubmit.disabled = false;
                btnIcon.innerHTML = '<ion-icon name="log-in-outline"></ion-icon>';
                btnText.textContent = 'Ingresar al Panel';
            }
        });

        function mostrarError(msg) {
            alertBox.className = 'alert alert-danger';
            alertBox.innerHTML = `<ion-icon name="alert-circle-outline"></ion-icon> <span>${msg}</span>`;
            alertBox.style.display = 'flex';
        }
    </script>
</body>
</html>
