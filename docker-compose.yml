services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: myg_db
      MYSQL_USER: myg
      MYSQL_PASSWORD: myg_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - myg_db_data:/var/lib/mysql
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: myg_db
      DB_USER: myg
      DB_PASSWORD: myg_secret
      APP_NAME: "MYG - Suscripción de Entretenimiento"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      SESSION_NAME: MYG_session
    depends_on:
      db:
        condition: service_healthy

volumes:
  myg_db_data:
